<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Main gradient purple to cyan -->
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#7c3aed"/>
      <stop offset="50%"  stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <!-- Glow gradient -->
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7c3aed" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8"/>
    </linearGradient>
    <!-- Inner shine -->
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="circle-clip">
      <circle cx="100" cy="100" r="96"/>
    </clipPath>
  </defs>

  <!-- Outer dark circle bg -->
  <circle cx="100" cy="100" r="98" fill="#08050f"/>

  <!-- Subtle radial glow bg -->
  <radialGradient id="bgGlow" cx="50%" cy="45%" r="55%">
    <stop offset="0%"   stop-color="#7c3aed" stop-opacity="0.18"/>
    <stop offset="60%"  stop-color="#ec4899" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
  </radialGradient>
  <circle cx="100" cy="100" r="96" fill="url(#bgGlow)"/>

  <!-- Outer ring border -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="url(#grad1)" stroke-width="2" opacity="0.7"/>

  <!-- Inner decorative ring -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="url(#grad2)" stroke-width="0.8" opacity="0.3" stroke-dasharray="6 4"/>

  <!-- ── Big A shape ── -->
  <g filter="url(#glow)">
    <!-- Left leg of A -->
    <polygon
      points="100,28  55,148  72,148  100,72"
      fill="url(#grad1)"
      opacity="0.95"
    />
    <!-- Right leg of A -->
    <polygon
      points="100,28  145,148  128,148  100,72"
      fill="url(#grad1)"
      opacity="0.95"
    />
    <!-- Crossbar of A -->
    <rect x="70" y="100" width="60" height="13" rx="4" fill="url(#grad2)" opacity="0.95"/>
  </g>

  <!-- Shine overlay on A -->
  <polygon points="100,28 55,148 72,148 100,72" fill="url(#shine)"/>
  <polygon points="100,28 145,148 128,148 100,72" fill="url(#shine)"/>

  <!-- ── Robot face inside A ── -->
  <g transform="translate(100, 116)">
    <!-- Robot head -->
    <rect x="-16" y="-14" width="32" height="24" rx="7" fill="#0d0a1a" stroke="url(#grad1)" stroke-width="1.5"/>

    <!-- Eyes -->
    <circle cx="-7" cy="-3" r="5" fill="#06b6d4" opacity="0.95" filter="url(#softglow)"/>
    <circle cx="7"  cy="-3" r="5" fill="#7c3aed" opacity="0.95" filter="url(#softglow)"/>
    <!-- Eye glints -->
    <circle cx="-5.5" cy="-4.5" r="1.5" fill="white" opacity="0.8"/>
    <circle cx="8.5"  cy="-4.5" r="1.5" fill="white" opacity="0.8"/>

    <!-- Smile -->
    <path d="M -6 5 Q 0 10 6 5" fill="none" stroke="#ec4899" stroke-width="2" stroke-linecap="round"/>

    <!-- Antenna -->
    <line x1="0" y1="-14" x2="0" y2="-22" stroke="url(#grad2)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="-24" r="3" fill="#ec4899" filter="url(#softglow)"/>
  </g>

  <!-- ── Orbit ring ── -->
  <ellipse cx="100" cy="120" rx="52" ry="14"
    fill="none" stroke="url(#grad1)" stroke-width="2.5"
    opacity="0.8" filter="url(#glow)"/>

  <!-- ── Pixel dots top-right ── -->
  <g fill="#06b6d4" opacity="0.85">
    <rect x="148" y="30" width="7" height="7" rx="1.5"/>
    <rect x="158" y="30" width="7" height="7" rx="1.5"/>
    <rect x="148" y="40" width="7" height="7" rx="1.5"/>
    <rect x="158" y="40" width="4" height="4" rx="1" opacity="0.5"/>
  </g>

  <!-- ── Small sparkle top-left ── -->
  <g fill="#ec4899" opacity="0.7">
    <rect x="35" y="32" width="5" height="5" rx="1.2"/>
    <rect x="43" y="36" width="3" height="3" rx="0.8" opacity="0.5"/>
  </g>

  <!-- Bottom text: ALOXADGPT -->
  <text
    x="100" y="174"
    text-anchor="middle"
    font-family="'Arial Black', 'Inter', sans-serif"
    font-weight="900"
    font-size="18"
    letter-spacing="-0.5"
    fill="white"
  >ALOXAD<tspan fill="url(#grad1)">GPT</tspan></text>

  <!-- Tagline -->
  <text
    x="100" y="188"
    text-anchor="middle"
    font-family="'Arial', 'Inter', sans-serif"
    font-size="7"
    letter-spacing="2.5"
    fill="#7c7ca0"
    font-weight="600"
  >CODE · CREATE · INNOVATE</text>
</svg>
